# dotbins sample configuration
# Generated by `dotbins init`
# See https://github.com/basnijholt/dotbins for more information

# Directory where tool binaries will be stored
tools_dir: ~/.dotbins

# Target platforms and architectures for which to download binaries
# These determine which system binaries will be downloaded and managed
platforms:
  linux:
    - amd64 # x86_64
    - arm64 # aarch64
  macos:
    - arm64 # Apple Silicon
  windows:
    - amd64 # 64-bit Windows

# Tool definitions
# Format: tool_name: owner/repo or detailed configuration
tools:

  # Essential CLI tools with minimal configuration
  bat:
    repo: sharkdp/bat
    shell_code:
      bash,zsh: |
        alias bat="bat --paging=never"
        alias cat="bat --paging=never"
        export BAT_THEME="Catppuccin Mocha"

  fzf:
    repo: junegunn/fzf
    shell_code:
      zsh: |
        export FZF_DEFAULT_OPTS=" \
        --color=bg+:#313244,bg:#1E1E2E,spinner:#F5E0DC,hl:#F38BA8 \
        --color=fg:#CDD6F4,header:#F38BA8,info:#CBA6F7,pointer:#F5E0DC \
        --color=marker:#B4BEFE,fg+:#CDD6F4,prompt:#CBA6F7,hl+:#F38BA8 \
        --color=selected-bg:#45475A \
        --color=border:#313244,label:#CDD6F4"
        source <(fzf --zsh)
      bash: |
        export FZF_DEFAULT_OPTS=" \
        --color=bg+:#313244,bg:#1E1E2E,spinner:#F5E0DC,hl:#F38BA8 \
        --color=fg:#CDD6F4,header:#F38BA8,info:#CBA6F7,pointer:#F5E0DC \
        --color=marker:#B4BEFE,fg+:#CDD6F4,prompt:#CBA6F7,hl+:#F38BA8 \
        --color=selected-bg:#45475A \
        --color=border:#313244,label:#CDD6F4"
        eval "$(fzf --bash)"
  lazygit:
    repo: jesseduffield/lazygit
    shell_code:
      bash,zsh: |
        alias lg="lazygit"
  zoxide:
    repo: ajeetdsouza/zoxide
    shell_code:
      bash,zsh: |
        eval "$(zoxide init __DOTBINS_SHELL__)"
  rip:
    repo: MilesCranmer/rip2
    shell_code:
      bash,zsh: |
        export RIP_GRAVEYARD=~/.local/share/Trash

  starship:
    repo: starship/starship
    shell_code:
      bash,zsh: |
        eval "$(starship init __DOTBINS_SHELL__)"

  atuin:
    repo: atuinsh/atuin
    arch_map:
      amd64: x86_64
      arm64: aarch64
    asset_patterns:
      linux: atuin-{arch}-unknown-linux-gnu.tar.gz
      macos: atuin-{arch}-apple-darwin.tar.gz
    shell_code:
      bash,zsh: |
        eval "$(atuin init __DOTBINS_SHELL__)"

  ddh:
    repo: darakian/ddh

  lsd:
    repo: lsd-rs/lsd
    shell_code:
      bash,zsh: |
        alias ls="lsd"
        alias ll="lsd -lh"
        alias la="lsd -lah"
        alias lt="lsd --tree"

  ouch:
    repo: ouch-org/ouch

  pueue:
    repo: Nukesor/pueue

  sk:
    repo: lotabout/skim
    shell_code:
      zsh: |
        eval "$(sk --shell zsh)"
      bash: |
        eval "$(sk --shell bash)"

  tldr:
    repo: dbrgn/tealdeer

  zellij:
    repo: zellij-org/zellij

  gh:
    repo: cli/cli
    asset_patterns:
      linux: gh_{version}_linux_{arch}.tar.gz
      macos: gh_{version}_macOS_{arch}.zip
      windows: gh_{version}_windows_{arch}.zip
    shell_code:
      bash,zsh: |
        eval "$(gh completion -s __DOTBINS_SHELL__)"

  mise:
    repo: jdx/mise
    arch_map:
      amd64: x64
    asset_patterns:
      linux: mise-v{version}-linux-{arch}.tar.gz
      macos: mise-v{version}-macos-{arch}.tar.gz
      windows: mise-v{version}-windows-{arch}.zip
    shell_code:
      bash,zsh: |
        eval "$(mise activate __DOTBINS_SHELL__)"

  ast-grep:
    repo: ast-grep/ast-grep
    binary_name: sg
    arch_map:
      amd64: x86_64
      arm64: aarch64
    asset_patterns:
      linux: app-{arch}-unknown-linux-gnu.zip
      macos: app-{arch}-apple-darwin.zip

  cargo-binstall:
    repo: cargo-bins/cargo-binstall
    arch_map:
      amd64: x86_64
      arm64: aarch64
    asset_patterns:
      linux: cargo-binstall-{arch}-unknown-linux-musl.tgz
      macos: cargo-binstall-{arch}-apple-darwin.zip

  docker-compose:
    repo: docker/compose
    arch_map:
      amd64: x86_64
      arm64: aarch64
    asset_patterns:
      linux: docker-compose-linux-{arch}
      macos: docker-compose-darwin-{arch}
    extract_archive: false

  gitui:
    repo: gitui-org/gitui
    arch_map:
      amd64: x86_64
      arm64: aarch64
    asset_patterns:
      linux: gitui-linux-{arch}.tar.gz
      macos: gitui-mac.tar.gz
